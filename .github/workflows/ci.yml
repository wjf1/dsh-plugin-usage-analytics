name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 零运行时依赖、测试也没有 devDependencies，不需要 install。
      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test

      # locale 文件缺 key 会在界面上显示成空字符串，用脚本提前拦住。
      - name: Check locale files
        run: node tools/check-locale.mjs
